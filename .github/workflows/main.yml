name: Tests

on: [push]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar tests
        run: pytest

      - name: Guardar reporte y evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte
          path: |
            reportes
            evidencias
